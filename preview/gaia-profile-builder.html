/* --- v2/common.css -------------------------------------------------------- */

* { margin: 0; padding: 0; }

html,
body { width: 100%; height: 100%; }

h1 { font-size: 16px; }
h2 { font-size: 14px; text-align: left; }
h3 { font-size: 12px; }
a { color: #BD8440; font-weight: bold; text-decoration: none; }
a:hover { text-decoration: underline; }
img { border: 0; }
li { list-style-type: none; }
.clear { clear: both; }
p { margin-bottom: 10px; }
#header { width: 100%; height: 170px; font-size: 10px; position: relative; top: 0; left: 0; }
.journal-date { font-size: x-small; }

/* Columns — Gaia's shell owns layout and reflow. */
#columns { position: relative; overflow: hidden; float: left; }
#column_1,
#column_2,
#column_3 { float: left; overflow: hidden; }
#column_1 { width: 230px; margin-left: 25px; display: inline; }
#column_2 { width: 500px; margin: 0 10px; }
#column_3 { width: 230px; }
#column_1 img { max-width: 205px; }
#column_2 img { max-width: 475px; }
#column_3 img { max-width: 205px; }

/* Item lists */
#id_badges li,

@keyframes float {
  0%, 100% { transform: translateY(0px); }

@keyframes neonPulse {
  0%, 100% {
    filter: drop-shadow(0 0 4px currentColor) brightness(1);
  }
  50% {
    filter: drop-shadow(0 0 16px currentColor) brightness(1.35);
  }
}

@keyframes glitchShake {
  0%, 100% { transform: translate(0); }
  20% { transform: translate(-3px, 2px); }
  40% { transform: translate(2px, -2px); }
  60% { transform: translate(-2px, -1px); }
  80% { transform: translate(3px, 1px); }
}

@keyframes shimmerSweep {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes rotate3d {
  0% { transform: perspective(700px) rotateY(0deg); }
  100% { transform: perspective(700px) rotateY(360deg); }
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.12); }
  30% { transform: scale(1.02); }
  45% { transform: scale(1.15); }
}

@keyframes bounce {

@keyframes marquee {

@keyframes rainbowBorder {

@keyframes scanline {

}

@keyframes cyberBlink {
  0%, 49.9% { opacity: 1; }

/* Shape morphs — border-radius / squash cycles */
@keyframes morphBlob {
  0%, 100% { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; }
  34% { border-radius: 70% 30% 46% 54% / 30% 62% 38% 70%; }

@keyframes morphLiquid {

}

@keyframes morphCorners {

}

@keyframes morphJelly {

  75% { transform: scale(1.04, 0.96); }
}
